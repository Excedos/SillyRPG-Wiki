                "content": "<div class=\"border-b border-rpg-border pb-4 mb-6\"><h1 class=\"text-2xl md:text-3xl font-bold text-white mb-1\">Commands Reference</h1><p class=\"text-rpg-muted text-sm\">Commands below are drawn from the current bot command help and command handlers. Some actions are also available through inline buttons.</p></div><div class=\"overflow-x-auto bg-rpg-card border border-rpg-border rounded-xl mb-6\"><table class=\"w-full\"><thead><tr><th class=\"p-3 text-left text-rpg-muted text-xs uppercase\">Command</th><th class=\"p-3 text-left text-rpg-muted text-xs uppercase\">What it does</th></tr></thead><tbody><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/start</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Create a character only through the new-save flow, or reopen the menu for an existing character.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/newsave</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Create a character/save in the current chat.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/saves</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">In private chat, choose a group save or Global Save.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/newglobalsave</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Create the MMO Global Save. It uses the global-save XP rules.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/globalsave</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Activate an existing Global Save.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/groupsave</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Switch back to the current group’s separate save.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/Wipedata</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Permanently reset the save in this group; confirmation is required.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/help</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Show the adventure command list.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/explore</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Explore the current region for combat, encounters, coins and items.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/places</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Choose the next region, subject to progression requirements.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/profile</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Show character stats and progression.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/inventory</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Browse inventory by category.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/wiki</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Open the SillyRPG guide in your browser.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/box</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Manage captured pets; supports deposit, withdraw and trade subcommands.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/renamepet NAME</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Rename a captured pet if its original name was not saved correctly.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/equip ID</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Equip a weapon or armor by inventory ID.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/use ID</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Use a consumable by inventory ID; in combat this uses your turn and the enemy responds.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/orb ID</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Use a Class Orb by inventory ID.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/sell ID *</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Sell an item stack; use /sell ID NUMBER for a quantity.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/sell RARITY weapons|armors</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Bulk-sell weapons or armor by rarity.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/sleep</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Restore HP to full in exchange for coins.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/boss</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Open a 30-second co-op boss lobby for up to 4 players.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/duel</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Open a 30-second duel lobby.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/arena</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Open an arena lobby; available in group chats.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/horses</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Open a 60-second horse race for up to 6 players; winner takes the pot.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/Trade @Username</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Create a safe player trade for items and coins.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\"><code class=\"text-purple-300\">/casino</code></td><td class=\"p-3 text-sm text-rpg-text align-top\">Open casino games.</td></tr></tbody></table></div><p class=\"text-sm text-rpg-muted\">Quick aliases supported by the bot include Pprofile, Hhunt, Dduel, Eequip, Uuse, Ssleep, Bboss, Aarena, Mmenu, Bbj and Sslot. Aliases are case-insensitive. Command availability can depend on chat type, save selection, or game state.</p>"

                "content": "<div class=\"border-b border-rpg-border pb-4 mb-6\"><h1 class=\"text-2xl md:text-3xl font-bold text-white mb-1\">Saves: Group & Global</h1><p class=\"text-rpg-muted text-sm\">The bot supports separate saves for group play and a shared MMO Global Save.</p></div><ul class=\"list-disc pl-5 space-y-2 text-sm text-rpg-text mb-6\"><li>Use /saves in private chat to choose a group save or Global Save.</li><li>/newglobalsave creates the Global Save; /globalsave activates an existing one.</li><li>/groupsave switches back to the current group’s separate save.</li><li>Global Save has slower XP progression than the group save, as stated in the bot help.</li><li>/Wipedata permanently resets the save in the current group and requires confirmation.</li></ul>"

            {
                "id": "leveling",
                "title": "Leveling, XP & Rebirth",
                "summary": "Progression, reward modifiers and Time Travel.",
                "content": "<div class=\"border-b border-rpg-border pb-4 mb-6\"><h1 class=\"text-2xl md:text-3xl font-bold text-white mb-1\">Leveling, XP & Rebirth</h1><p class=\"text-rpg-muted text-sm\">XP and coin rewards are calculated by the combat/reward system and can be affected by global save rules, buffs, equipment boosts and Rebirth.</p></div><ul class=\"list-disc pl-5 space-y-2 text-sm text-rpg-text mb-6\"><li>Character progression includes level, XP, HP, attack, defense and class-related stats.</li><li>XP rewards can be affected by active XP buffs and equipped XP bonuses.</li><li>Coin rewards can be affected by active Gold buffs, equipment coin boosts and Rebirth.</li><li>At level 101, the menu exposes Time Travel. Confirming it resets the character’s current progression and equipment/inventory/pets, while preserving Rebirth count and rCoins.</li><li>Each Rebirth grants a permanent +5% XP bonus, +5% gold bonus and 5 rCoins. These bonuses stack with each Rebirth.</li><li>Time Travel is irreversible; review the confirmation screen before proceeding.</li></ul>"

\">Does the wiki publish exact loot odds?</td><td class=\"p-3 text-sm text-rpg-text align-top\">Only when the bot data explicitly supports them. Event-specific loot tables are data-driven and may vary by region or item.</td></tr></tbody></table></div>"

                "title": "Exploration & Random Events",
                "summary": "What can happen when you explore and how event screens work.",
                "content": "<div class=\"border-b border-rpg-border pb-4 mb-6\"><h1 class=\"text-2xl md:text-3xl font-bold text-white mb-1\">Exploration & Random Events</h1><p class=\"text-rpg-muted text-sm\">/explore rolls the current region’s configured encounters. Results include ordinary encounters, combat, loot, healing, resources and special events.</p></div><p class=\"text-sm text-rpg-text mb-4\">Exploration events remain active until resolved or left. The event screen offers choices specific to the event; leaving it ends that active event.</p><div class=\"overflow-x-auto bg-rpg-card border border-rpg-border rounded-xl mb-6\"><table class=\"w-full\"><thead><tr><th class=\"p-3 text-left text-rpg-muted text-xs uppercase\">Event / Discovery</th><th class=\"p-3 text-left text-rpg-muted text-xs uppercase\">Configured effect</th></tr></thead><tbody><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Lost Satchel / Pouch</td><td class=\"p-3 text-sm text-rpg-text align-top\">Find a small amount of Coins.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Old Waystone / Ancient Runes</td><td class=\"p-3 text-sm text-rpg-text align-top\">Gain XP from inscriptions or runes.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Healing Spring / Spirit Guide</td><td class=\"p-3 text-sm text-rpg-text align-top\">Restore HP; some blessings also grant XP.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Herbs / Mushrooms</td><td class=\"p-3 text-sm text-rpg-text align-top\">May yield a potion or healing, depending on the event.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Wandering Merchant</td><td class=\"p-3 text-sm text-rpg-text align-top\">Offers region-dependent wares for a limited event session.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Buried Cache / Treasure Map / Crystal Shard</td><td class=\"p-3 text-sm text-rpg-text align-top\">May grant equipment, items, Coins or other configured rewards.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Cursed Altar / Glowing Chest</td><td class=\"p-3 text-sm text-rpg-text align-top\">Risk/reward event that can grant Coins or loot, but may damage the character.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Time Rift / Phoenix Ember</td><td class=\"p-3 text-sm text-rpg-text align-top\">Can grant XP, healing and/or a potion.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Class Orb discoveries</td><td class=\"p-3 text-sm text-rpg-text align-top\">Some rare caches, shrines or rifts can grant a random Class Orb.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Grand Blacksmith</td><td class=\"p-3 text-sm text-rpg-text align-top\">Rare event to upgrade a weapon for Coins.</td></tr><tr class=\"border-t border-rpg-border/70\"><td class=\"p-3 text-sm text-rpg-text align-top\">Legendary companion encounter</td><td class=\"p-3 text-sm text-rpg-text align-top\">May be peaceful, aggressive, or require answering a question.</td></tr></tbody></table></div><p class=\"text-xs text-rpg-muted\">Exact reward ranges and probabilities are controlled by the bot source and can vary by event; this page avoids claiming undocumented rates.</p>"

                "content": "<div class=\"border-b border-rpg-border pb-4 mb-6\"><h1 class=\"text-2xl md:text-3xl font-bold text-white mb-1\">Pets & Capturing</h1><p class=\"text-rpg-muted text-sm\">Pets can be captured from eligible non-boss humanoid monsters using suitable capture consumables. Bosses cannot be captured.</p></div><ul class=\"list-disc pl-5 space-y-2 text-sm text-rpg-text mb-6\"><li>Bosses cannot be captured; a capture item is not consumed when the target is a boss.</li><li>Use /box to manage captured pets. The box supports deposit, withdraw and trading by ID.</li><li>/renamepet NEW_NAME renames a pet if its initial naming flow failed.</li><li>Pets have levels and stats, and their combat stats contribute when the active pet participates.</li><li>Some pet passives can affect combat; pet growth and stats are calculated from the pet template and level.</li></ul><div class=\"bg-rpg-card border border-rpg-border p-4 rounded-xl\"><h3 class=\"font-bold text-emerald-300 mb-2\">Pet management commands</h3><div class=\"text-sm text-rpg-text\"><code>/box</code><br><code>/box deposit ID</code><br><code>/box withdraw ID</code><br><code>/box trade @Username ID</code><br><code>/renamepet NEW_NAME</code></div></div>"

        // STATE VARIABLES
        let activeTopicId = "commands-list"; // Default active topic
        let expandedCategories = new Set(["general", "world-exploration", "character-systems", "social-economy"]);

        // DOM ELEMENTS
        const sidebarMenu = document.getElementById('sidebar-menu');
        const contentArea = document.getElementById('content-area');
        const searchInput = document.getElementById('search-input');
        const mobileSearchInput = document.getElementById('mobile-search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const topicCountBadge = document.getElementById('topic-count-badge');

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            countTotalTopics();
            
            // Check URL hash for direct topic navigation
            if (window.location.hash) {
                const targetId = window.location.hash.replace('#', '');
                if (findTopicById(targetId)) {
                    activeTopicId = targetId;
                    const parentCat = wikiData.find(cat => cat.items.some(item => item.id === targetId));
                    if (parentCat) expandedCategories.add(parentCat.id);
                }
            }

            renderSidebar();
            renderContent(activeTopicId);
            setupEventListeners();
        });

        // COUNT TOTAL ARTICLES
        function countTotalTopics() {
            let count = 0;
            wikiData.forEach(cat => count += cat.items.length);
            topicCountBadge.textContent = `${count} Articles`;
        }

        // FIND TOPIC BY ID
        function findTopicById(id) {
            for (const cat of wikiData) {
                const item = cat.items.find(i => i.id === id);
                if (item) return item;
            }
            return null;
        }

        // RENDER SIDEBAR ACCORDION
        function renderSidebar(filterText = '') {
            sidebarMenu.innerHTML = '';
            const query = filterText.toLowerCase().trim();

            wikiData.forEach(cat => {
                const matchingItems = cat.items.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    item.summary.toLowerCase().includes(query) ||
                    item.content.toLowerCase().includes(query)
                );

                if (query.length > 0 && matchingItems.length === 0) return;

                const isExpanded = query.length > 0 || expandedCategories.has(cat.id);

                const catGroup = document.createElement('div');
                catGroup.className = 'mb-2';

                catGroup.innerHTML = `
                    <button class="w-full flex items-center justify-between p-2 rounded-lg text-sm font-semibold text-rpg-text hover:bg-rpg-card/80 transition-colors focus:outline-none" 
                            onclick="toggleCategory('${cat.id}')">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid ${cat.icon} text-purple-400 w-4 text-center"></i>
                            <span>${cat.category}</span>
                        </div>
                        <i class="fa-solid fa-chevron-down text-xs text-rpg-muted transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}"></i>
                    </button>
                    <div class="ml-4 pl-3 border-l border-rpg-border/80 mt-1 space-y-1 ${isExpanded ? 'block' : 'hidden'}">
                        ${(query.length > 0 ? matchingItems : cat.items).map(item => `
                            <button onclick="selectTopic('${item.id}')" 
                                    class="w-full text-left py-1.5 px-2.5 rounded text-xs transition-all block truncate ${item.id === activeTopicId ? 'bg-purple-500/20 text-purple-300 font-semibold border-r-2 border-purple-500' : 'text-rpg-muted hover:text-rpg-text hover:bg-rpg-card/50'}">
                                ${item.title}
                            </button>
                        `).join('')}
                    </div>
                `;

                sidebarMenu.appendChild(catGroup);
            });

            if (sidebarMenu.children.length === 0) {
                sidebarMenu.innerHTML = `
                    <div class="p-4 text-center text-rpg-muted text-xs">
                        <i class="fa-solid fa-magnifying-glass text-2xl mb-2 text-rpg-border"></i>
                        <p>No documentation found matching "${filterText}"</p>
                    </div>
                `;
            }
        }

        // TOGGLE CATEGORY EXPANSION
        window.toggleCategory = function(catId) {
            if (expandedCategories.has(catId)) {
                expandedCategories.delete(catId);
            } else {
                expandedCategories.add(catId);
            }
            renderSidebar(searchInput.value || mobileSearchInput.value);
        }

        // SELECT AND DISPLAY TOPIC
        window.selectTopic = function(topicId) {
            activeTopicId = topicId;
            window.location.hash = topicId;

            const parentCat = wikiData.find(cat => cat.items.some(item => item.id === topicId));
            if (parentCat) expandedCategories.add(parentCat.id);

            renderSidebar(searchInput.value || mobileSearchInput.value);
            renderContent(topicId);

            closeMobileSidebar();
            document.querySelector('main').scrollTop = 0;
        }

        // COPY TOPIC DEEP LINK
        window.copyTopicLink = function(topicId) {
            const url = `${window.location.origin}${window.location.pathname}#${topicId}`;
            const tempInput = document.createElement('input');
            document.body.appendChild(tempInput);
            tempInput.value = url;
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            // Show Toast
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-purple-600 text-white text-xs px-4 py-2 rounded-lg shadow-xl z-50 flex items-center gap-2 border border-purple-400/30 animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-check"></i> Link copied to clipboard!`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // RENDER CONTENT AREA
        function renderContent(topicId) {
            const topic = findTopicById(topicId);
            if (!topic) {
                contentArea.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa-solid fa-circle-exclamation text-4xl text-purple-400 mb-3"></i>
                        <h2 class="text-xl font-bold text-white">Topic Not Found</h2>
                        <p class="text-rpg-muted text-sm mt-1">Please select a valid guide from the sidebar index.</p>
                    </div>
                `;
                return;
            }

            contentArea.innerHTML = topic.content;
        }

        // MOBILE SIDEBAR CONTROLS
        function openMobileSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeMobileSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        // EVENT LISTENERS SETUP
        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                mobileSearchInput.value = val;
                clearSearchBtn.classList.toggle('hidden', val.length === 0);
                renderSidebar(val);
            });

            mobileSearchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                searchInput.value = val;
                renderSidebar(val);
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                mobileSearchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderSidebar();
            });

            mobileMenuBtn.addEventListener('click', openMobileSidebar);
            sidebarOverlay.addEventListener('click', closeMobileSidebar);

            window.addEventListener('hashchange', () => {
                const hashId = window.location.hash.replace('#', '');
                if (hashId && hashId !== activeTopicId && findTopicById(hashId)) {
                    selectTopic(hashId);
                }
            });
        }
    </script>

    <script>
        // If the Wiki and bot API use different domains, set this global before this script:
        // Default backend URL matches the app name in fly.toml. Override this global if you deploy elsewhere.
        // window.SILLYRPG_BOT_STATUS_API_URL = "https://YOUR-BACKEND-HOST/api/bot-status";
        (() => {
            const label = document.getElementById('bot-status-label');
            const dot = document.getElementById('bot-status-dot');
            if (!label || !dot) return;

            // GitHub Pages is static; configure this only after the bot backend is hosted.
            const explicitUrl = window.SILLYRPG_BOT_STATUS_API_URL || 'https://sillyrpg-main.fly.dev/api/bot-status';
            const endpoint = explicitUrl.trim();
            const styles = {
                online: { text: 'Online', color: 'text-green-400', pulse: true },
                starting: { text: 'Starting...', color: 'text-yellow-400', pulse: true },
                degraded: { text: 'Degraded', color: 'text-yellow-400', pulse: false },
                offline: { text: 'Offline', color: 'text-red-400', pulse: false },
                unknown: { text: 'Status unavailable', color: 'text-gray-400', pulse: false },
                unconfigured: { text: 'Status not configured', color: 'text-gray-400', pulse: false }
            };

            function render(state) {
                const view = styles[state] || styles.unknown;
                label.textContent = view.text;
                label.className = view.color + ' font-medium';
                dot.className = 'fa-solid fa-circle text-[8px] ' + view.color + (view.pulse ? ' animate-pulse' : '');
            }

            if (!endpoint) {
                render('unconfigured');
                return;
            }

            async function refreshBotStatus() {
                try {
                    const response = await fetch(endpoint, {
                        method: 'GET',
                        cache: 'no-store',
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!response.ok) throw new Error('Status endpoint returned HTTP ' + response.status);
                    const data = await response.json();
                    if (!data || !Object.prototype.hasOwnProperty.call(styles, data.status) || data.status === 'unknown' || data.status === 'unconfigured') {
                        throw new Error('Unexpected status response');
                    }
                    render(data.status);
                } catch (_error) {
                    render('unknown');
                }
            }

            refreshBotStatus();
            window.setInterval(refreshBotStatus, 15000);
        })();
    </script>
